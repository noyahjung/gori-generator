<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gori Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Black+Han+Sans&family=Bungee&family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=Jua&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@300;500;700;900&family=Noto+Serif+KR:wght@400;700;900&family=Pacifico&family=Playfair+Display:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="panel">
    <header>
      <h1>Gori Generator</h1>
      <p>글자 윤곽을 따라 리본 고리가 이어집니다.</p>
    </header>
    <div class="actions">
      <button id="replay" class="primary">다시 그리기</button>
      <button id="play">일시정지</button>
      <button id="random">랜덤</button>
    </div>
    <div id="controls"></div>
    <div class="actions export">
      <button id="png">PNG 저장</button>
      <button id="svg">SVG 저장</button>
    </div>
    <footer>Space 재생/정지 · Enter 다시 그리기 · R 랜덤</footer>
  </aside>
  <main id="stage">
    <canvas id="cv"></canvas>
    <button id="toggle-panel" title="패널 접기/펴기">☰</button>
  </main>

  <script src="js/ribbon.js"></script>
  <script src="js/outline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
